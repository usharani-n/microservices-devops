server {
    listen 80;
    server_name _;

    # Nginx's own health endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Per-service health checks through Nginx (used later by Jenkins to verify deployments)
    location = /health/users    { proxy_pass http://user-service:4002/api-docs/; }
    location = /health/products { proxy_pass http://product-service:4001/api-docs/; }
    location = /health/orders   { proxy_pass http://order-service:4000/api-docs/; }

    # Application routes
    location /api/users    { proxy_pass http://user-service:4002;    include /etc/nginx/proxy_params; }
    location /api/products { proxy_pass http://product-service:4001; include /etc/nginx/proxy_params; }
    location /api/orders   { proxy_pass http://order-service:4000;   include /etc/nginx/proxy_params; }
}
